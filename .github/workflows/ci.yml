name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run lint

      - name: Test
        run: bun test

      # The contract gate and the pack gate are separate failures: the first
      # catches a manifest or gate wiring that is wrong, the second catches a
      # prepack that makes the package unpublishable. Both were green-boarded
      # before this job existed.
      - name: Contract gate
        run: bun run contract-gate

      - name: Pack
        run: npm pack --dry-run
